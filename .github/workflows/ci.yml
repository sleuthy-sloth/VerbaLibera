name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npx prisma generate

      - name: Validate and build course packs
        run: npm run content:build

      - name: Deployment-import guard
        # Fails when production TS imports a path excluded by .vercelignore —
        # the class of bug that passes locally and explodes in the Vercel build
        # context. Also runs inside `npm run build`'s prebuild.
        run: npm run content:check-deployment-imports

      - name: Voice-service contract tests
        # The speech and translation engines are imported lazily, so the
        # contract suite runs without the multi-gigabyte local model
        # environment (and CI must never download one). Dependency set matches
        # the contract-test half of services/voice/requirements.txt.
        run: python -m pytest services/voice/tests -q

      - name: Lint
        run: npm run lint

      - name: Vitest run
        run: npx vitest run

      - name: Next build
        # `npm run build` (not `npx next build`): it runs the prebuild checks and
        # pins `next build --webpack`, which is the path that ships. Vercel's
        # Turbopack output omits .next/next-server.js.nft.json and crashes its
        # file-tracing step, so a Turbopack build here would prove nothing.
        run: npm run build
        env:
          # Use dummy DATABASE_URL for build; prisma generate already validated schema
          DATABASE_URL: postgresql://user:pass@localhost:5432/verbalibera_ci

      - name: Type check
        run: npm run typecheck

      - name: Build portable edition
        run: npm run portable:build

      - name: Verify portable edition
        run: npm run portable:verify

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Accessibility gate
        # Named separately so a contrast or navigation regression reads as an
        # accessibility failure, not as a flaky e2e run. Covers every learner
        # route at desktop and mobile, plus the desktop primary-navigation
        # assertion the bottom tab capsule cannot make below 768px.
        run: npx playwright test tests/e2e/a11y.spec.ts --project=chromium --workers=1

      - name: Playwright test (chromium)
        # Serial workers: parallel workers flake under dev-server compile
        # contention (hydration/timeout failures that move between runs).
        run: npx playwright test --project=chromium --workers=1

      - name: Portable file test (Chromium and WebKit)
        run: npx playwright test --config playwright.portable.config.ts

      - name: Offline matrix (Chromium and WebKit)
        # The installed/offline path is where engine differences actually bite
        # (service worker registration, Cache Storage, media from a cache), and
        # iOS is WebKit. Runs on its own port so it never reuses another server.
        run: npx playwright test --config playwright.offline.config.ts

      - name: Upload portable edition
        uses: actions/upload-artifact@v4
        with:
          name: VerbaLibera-Portable
          path: |
            dist/portable/VerbaLibera-Portable.html
            dist/portable/VerbaLibera-Portable.html.sha256
          if-no-files-found: error

      - name: Dump e2e failure snapshots
        if: failure()
        run: find test-results -name 'error-context.md' -exec echo "=== {} ===" \; -exec cat {} \; 2>/dev/null | head -250
