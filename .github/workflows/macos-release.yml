name: macOS release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  macos-release:
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      VERBALIBERA_TEST_TLS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: XCode command line tools check
        run: xcode-select -p && otool --version

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate and generate
        run: npx prisma validate && npx prisma generate

      - name: Validate and build course packs
        run: npm run content:build

      - name: Content validation
        run: npm run content:validate && npm run content:duplicates && npm run content:audio-check && npm run content:coverage

      - name: Lint
        run: npm run lint

      # The staged PostgreSQL runtime must exist BEFORE any vitest call. This
      # job sets VERBALIBERA_TEST_TLS=1 at job level, so
      # tests/desktop-postgres-tls.test.ts activates on the FIRST run and
      # spawns .desktop-stage/postgres/bin/initdb. These two steps used to sit
      # after the tests, so that test failed with ENOENT on every tag ever cut
      # (v0.1.0, v0.2.0, v0.3.0) and took the whole release job with it.
      - name: Prepare PostgreSQL runtime
        run: npm run postgres:prepare

      - name: Verify PostgreSQL runtime
        run: npm run postgres:verify

      - name: Vitest run
        run: npx vitest run

      - name: Release workflow tests
        run: npx vitest run tests/ci-workflow.test.ts tests/macos-release-workflow.test.ts tests/desktop-packaging.test.ts tests/desktop-artifact.test.ts

      - name: Next build
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:***@localhost:5432/verbalibera_ci

      - name: Type check
        run: npm run typecheck

      - name: Build portable edition
        run: npm run portable:build

      - name: Verify portable edition
        run: npm run portable:verify

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Portable file test (Chromium and WebKit)
        run: npx playwright test --config playwright.portable.config.ts

      - name: Compile desktop shell
        run: npm run desktop:compile

      - name: Stage Next server
        run: npm run desktop:stage-next

      - name: Electron end-to-end (first run and recovery)
        run: npx playwright test --config playwright.electron.config.ts

      - name: Package Electron DMG (unsigned, arm64)
        run: npm run electron:make

      - name: Verify Electron artifact
        run: npm run electron:verify

      - name: List deliverables
        run: ls -la dist/portable/VerbaLibera-Portable.html* dist/electron/VerbaLibera-mac-arm64.dmg*

      - name: Upload portable edition
        uses: actions/upload-artifact@v4
        with:
          name: VerbaLibera-Portable
          path: |
            dist/portable/VerbaLibera-Portable.html
            dist/portable/VerbaLibera-Portable.html.sha256
          if-no-files-found: error

      - name: Upload Electron edition
        uses: actions/upload-artifact@v4
        with:
          name: VerbaLibera-macOS
          path: |
            dist/electron/VerbaLibera-mac-arm64.dmg
            dist/electron/VerbaLibera-mac-arm64.dmg.sha256
          if-no-files-found: error

      - name: Attach files to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes "VerbaLibera ${{ github.ref_name }}: portable HTML and unsigned Apple Silicon DMG."
          fi
          gh release upload "${{ github.ref_name }}" \
            dist/portable/VerbaLibera-Portable.html \
            dist/portable/VerbaLibera-Portable.html.sha256 \
            dist/electron/VerbaLibera-mac-arm64.dmg \
            dist/electron/VerbaLibera-mac-arm64.dmg.sha256 \
            --clobber

      - name: Dump e2e failure snapshots
        if: failure()
        run: find test-results -name 'error-context.md' -exec echo "=== {} ===" \; -exec cat {} \; 2>/dev/null | head -250
