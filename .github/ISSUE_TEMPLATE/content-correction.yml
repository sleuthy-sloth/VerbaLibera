name: Content correction
description: Report a wrong or unnatural sentence, translation, or audio model in a lesson.
title: "[content]: "
labels: ["content"]
body:
  - type: input
    id: lesson
    attributes:
      label: Lesson
      description: Language and lesson title, e.g. Italian, Aches and the doctor.
      placeholder: Italian, Aches and the doctor
    validations:
      required: true
  - type: input
    id: exercise
    attributes:
      label: Exercise
      description: The prompt text as shown in the app.
      placeholder: Write in Italian - My head hurts
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: What it says now, what it should say, and why (if you know).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Course pack version (optional)
      description: From the course's report — docs/astra/reports/<language>.json publishes `version`, and the app shows it with the course.
      placeholder: 1.4.2
  - type: input
    id: activity
    attributes:
      label: Lesson or activity id (optional)
      description: The pack's own id for the exercise, which is what a fix is keyed by. `npm run content:outcomes` lists lesson ids, and the report lists activity ids.
      placeholder: it-cafe-order-foundation-produce
  - type: dropdown
    id: kind
    attributes:
      label: Kind of problem
      options:
        - Wrong word or grammar
        - Unnatural phrasing (a native speaker would not say this)
        - Wrong or misleading translation
        - Audio does not match the text
        - Typo or punctuation
        - Other
    validations:
      required: true
  - type: input
    id: background
    attributes:
      label: Your background (optional)
      description: e.g. native speaker, B2 learner, teacher. Helps weigh corrections.
  - type: textarea
    id: revalidation
    attributes:
      label: Revalidation (for the maintainer, filled in when the correction closes)
      description: Which checks were re-run against the fixed pack, and what the result was — `npm run content:validate`, the regenerated reports, `npm run content:audio-check` when audio moved, and the human listening pass if the recording changed.
      placeholder: content:validate OK; reports regenerated; audio unchanged, no listening pass needed.
