<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f3ee" />
    <title>VoxLibre is offline</title>
    <style>
      :root { color: #24221f; background: #f4f3ee; font-family: system-ui, sans-serif; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 1.5rem; }
      main { max-width: 32rem; padding: 2rem; border: 1px solid #1e6563; border-radius: .5rem; background: #fff; }
      h1 { font-family: Georgia, 'Times New Roman', serif; }
      main > p:first-child { color: #1e6563; }
      p { line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <p>VoxLibre</p>
      <h1>Your practice path is waiting.</h1>
      <p>Reconnect to continue your guided session. Your normal touch and keyboard practice controls will be ready when you return.</p>
    </main>
  </body>
</html>
