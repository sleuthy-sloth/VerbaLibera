<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src file:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>VerbaLibera recovery</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; background: #f4f3ee; color: #1a1f1e; margin: 0; padding: 32px; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 26px; letter-spacing: -0.02em; }
  button { font-size: 15px; font-weight: 700; padding: 10px 20px; margin-right: 8px; border-radius: 999px; border: 1px solid #1e656355; background: linear-gradient(to bottom, #1e6563, #174b4a); color: #f4f3ee; box-shadow: inset 0 1px 0 rgb(255 255 255 / 35%), 0 2px 12px rgb(26 31 30 / 12%); cursor: pointer; }
  pre { background: rgb(255 255 255 / 78%); border: 1px solid rgb(255 255 255 / 60%); border-radius: 20px; padding: 16px 18px; white-space: pre-wrap; box-shadow: inset 0 1px 0 rgb(255 255 255 / 65%), 0 2px 12px rgb(26 31 30 / 12%); }
</style>
</head>
<body>
<main>
  <h1>VerbaLibera needs attention</h1>
  <p id="summary">The app could not start.</p>
  <pre id="detail"></pre>
  <button id="reveal-log" type="button">Show log</button>
  <button id="restart" type="button">Restart</button>
</main>
<script src="./recovery.js"></script>
</body>
</html>
