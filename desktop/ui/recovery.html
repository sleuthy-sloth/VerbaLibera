<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src file:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>VerbaLibera recovery</title>
<style>
  /* Warm Studio. Standalone desktop screen — no stylesheet is loaded, so the
     values are spelled out. Keep in step with src/app/globals.css. */
  :root {
    --canvas: #fbf4e6; --stock: #fffdf7; --ink: #2f2a24;
    --accent: #a8511f; --muted-ink: #645f56; --edge: #16130e;
    --display: Fraunces, Georgia, 'Times New Roman', serif;
  }
  body { font-family: -apple-system, system-ui, sans-serif; background: var(--canvas); color: var(--ink); margin: 0; padding: 32px; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-family: var(--display); font-weight: 600; font-size: 26px; letter-spacing: -0.02em; }
  button {
    font: inherit; font-size: 15px; font-weight: 650; padding: 10px 20px; margin-right: 8px;
    border-radius: 3px; border: 1.5px solid var(--edge); background: var(--accent); color: var(--stock);
    box-shadow: 4px 4px 0 var(--edge); cursor: pointer;
  }
  button:hover { background: var(--accent-strong, #8f4318); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  pre {
    background: var(--stock); border: 1.5px solid var(--edge); border-radius: 4px;
    padding: 16px 18px; white-space: pre-wrap; box-shadow: 4px 4px 0 var(--edge);
  }
</style>
</head>
<body>
<main>
  <h1>VerbaLibera needs attention</h1>
  <p id="summary">The app could not start.</p>
  <pre id="detail"></pre>
  <button id="reveal-log" type="button">Show log</button>
  <button id="restart" type="button">Restart</button>
</main>
<script src="./recovery.js"></script>
</body>
</html>
