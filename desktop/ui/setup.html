<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src file:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>VerbaLibera setup</title>
<style>
  /* Warm Studio. Standalone desktop screen — no stylesheet is loaded, so the
     values are spelled out. Keep in step with src/app/globals.css. There is
     deliberately no backdrop-filter: the material is stacked paper, so depth
     comes from a hard offset, never a blur. */
  :root {
    --canvas: #fbf4e6; --stock: #fffdf7; --ink: #2f2a24;
    --accent: #a8511f; --accent-strong: #8f4318; --accent-soft: #f6e3cd;
    --muted-ink: #645f56; --edge: #16130e; --attention: #8f4b3a;
    --display: Fraunces, Georgia, 'Times New Roman', serif;
  }
  body { font-family: -apple-system, system-ui, sans-serif; background: var(--canvas); color: var(--ink); margin: 0; padding: 32px; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-family: var(--display); font-weight: 600; font-size: 26px; letter-spacing: -0.02em; }
  p { color: var(--muted-ink); line-height: 1.55; }
  .choice {
    border: 1.5px solid var(--edge); border-radius: 4px; padding: 20px 22px; margin: 14px 0;
    background: var(--stock); box-shadow: 5px 5px 0 var(--edge);
  }
  .choice h2 { font-family: var(--display); font-weight: 600; margin: 0 0 6px; font-size: 18px; letter-spacing: -0.01em; }
  .choice p { margin: 0 0 12px; font-size: 14px; }
  button {
    font: inherit; font-size: 15px; font-weight: 650; padding: 10px 20px; border-radius: 3px;
    border: 1.5px solid var(--edge); background: var(--accent); color: var(--stock);
    box-shadow: 4px 4px 0 var(--edge); cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--accent-strong); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  button:disabled { opacity: 0.55; cursor: default; }
  label { display: block; font-size: 13px; font-weight: 700; margin: 10px 0 4px; }
  input[type=text] {
    width: 100%; box-sizing: border-box; font: inherit; font-size: 13px; padding: 10px 14px; margin: 4px 0 8px;
    border: 1.5px solid var(--edge); border-radius: 3px; background: var(--stock); color: var(--ink);
  }
  input[type=text]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #status { min-height: 24px; margin-top: 12px; font-size: 14px; }
  .error { color: var(--attention); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Welcome to VerbaLibera</h1>
  <p>Choose where your learning data lives on this Mac.</p>
  <div class="choice">
    <h2>Local on this Mac</h2>
    <p>Private database inside the app. Nothing leaves your computer.</p>
    <button id="choose-local" type="button">Use local storage</button>
  </div>
  <div class="choice">
    <h2>My PostgreSQL server</h2>
    <p>Use a database you control. It must require TLS and have an empty dedicated database.</p>
    <label for="remote-url">Connection string</label>
    <input id="remote-url" type="text" autocomplete="off" spellcheck="false"
      placeholder="postgresql://USER@HOST:5432/DBNAME?sslmode=require">
    <button id="inspect-remote" type="button">Check connection</button>
    <div id="pending"></div>
    <button id="approve-remote" type="button" hidden>Approve and migrate</button>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
</main>
<script src="./setup.js"></script>
</body>
</html>
