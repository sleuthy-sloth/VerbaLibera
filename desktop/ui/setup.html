<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src file:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>VerbaLibera setup</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; background: #f4f3ee; color: #1a1f1e; margin: 0; padding: 32px; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 26px; letter-spacing: -0.02em; }
  p { color: #46534f; line-height: 1.55; }
  .choice { border: 1px solid rgb(255 255 255 / 60%); border-radius: 20px; padding: 20px 22px; margin: 14px 0; background: rgb(255 255 255 / 78%); -webkit-backdrop-filter: blur(22px) saturate(1.8); backdrop-filter: blur(22px) saturate(1.8); box-shadow: inset 0 1px 0 rgb(255 255 255 / 65%), 0 2px 12px rgb(26 31 30 / 12%); }
  .choice h2 { margin: 0 0 6px; font-size: 18px; letter-spacing: -0.01em; }
  .choice p { margin: 0 0 12px; font-size: 14px; }
  button { font-size: 15px; font-weight: 700; padding: 10px 20px; border-radius: 999px; border: 1px solid #1e656355; background: linear-gradient(to bottom, #1e6563, #174b4a); color: #f4f3ee; box-shadow: inset 0 1px 0 rgb(255 255 255 / 35%), 0 2px 12px rgb(26 31 30 / 12%); cursor: pointer; }
  button:disabled { opacity: 0.55; cursor: default; }
  label { display: block; font-size: 13px; font-weight: 700; margin: 10px 0 4px; }
  input[type=text] { width: 100%; box-sizing: border-box; font-size: 13px; padding: 10px 14px; margin: 4px 0 8px; border: 1px solid #768a82; border-radius: 14px; background: #fff; color: #1a1f1e; }
  #status { min-height: 24px; margin-top: 12px; font-size: 14px; }
  .error { color: #a00; }
</style>
</head>
<body>
<main>
  <h1>Welcome to VerbaLibera</h1>
  <p>Choose where your learning data lives on this Mac.</p>
  <div class="choice">
    <h2>Local on this Mac</h2>
    <p>Private database inside the app. Nothing leaves your computer.</p>
    <button id="choose-local" type="button">Use local storage</button>
  </div>
  <div class="choice">
    <h2>My PostgreSQL server</h2>
    <p>Use a database you control. It must require TLS and have an empty dedicated database.</p>
    <label for="remote-url">Connection string</label>
    <input id="remote-url" type="text" autocomplete="off" spellcheck="false"
      placeholder="postgresql://USER@HOST:5432/DBNAME?sslmode=require">
    <button id="inspect-remote" type="button">Check connection</button>
    <div id="pending"></div>
    <button id="approve-remote" type="button" hidden>Approve and migrate</button>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
</main>
<script src="./setup.js"></script>
</body>
</html>
